name: CI

on:
  push:
    branches: [main, "chore/upgrade-longbridge-sdk-5x"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit / smoke tests
        run: pytest -q -m "not integration"

  paper-integration:
    name: paper-integration
    runs-on: ubuntu-latest
    needs: unit
    # Do not gate on secrets in job-level `if` (can fail the whole workflow).
    # Skip inside the job when paper secrets are unset.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Paper integration (read-only)
        env:
          LONGBRIDGE_PAPER_APP_KEY: ${{ secrets.LONGBRIDGE_PAPER_APP_KEY }}
          LONGBRIDGE_PAPER_APP_SECRET: ${{ secrets.LONGBRIDGE_PAPER_APP_SECRET }}
          LONGBRIDGE_PAPER_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_PAPER_ACCESS_TOKEN }}
          LONGBRIDGE_DEFAULT_MODE: paper
          LONGBRIDGE_HTTP_URL: ${{ secrets.LONGBRIDGE_HTTP_URL }}
          LONGBRIDGE_REGION: ${{ secrets.LONGBRIDGE_REGION }}
          LONGBRIDGE_PAPER_ALLOW_ORDER: ${{ secrets.LONGBRIDGE_PAPER_ALLOW_ORDER }}
        run: |
          if [ -z "${LONGBRIDGE_PAPER_ACCESS_TOKEN}" ]; then
            echo "No LONGBRIDGE_PAPER_ACCESS_TOKEN secret — skipping paper integration."
            exit 0
          fi
          pytest -q -m integration
