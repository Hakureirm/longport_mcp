name: CI

on:
  push:
    branches: [main, "chore/upgrade-longbridge-sdk-5x"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit / smoke tests
        run: pytest -q -m "not integration"

  paper-integration:
    name: paper-integration
    runs-on: ubuntu-latest
    # Same-repo PRs / pushes only see secrets; forks get empty → job skipped.
    # Owner: add LONGBRIDGE_PAPER_* under Settings → Secrets and variables → Actions.
    if: ${{ secrets.LONGBRIDGE_PAPER_ACCESS_TOKEN != '' }}
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Paper integration (read-only)
        env:
          LONGBRIDGE_PAPER_APP_KEY: ${{ secrets.LONGBRIDGE_PAPER_APP_KEY }}
          LONGBRIDGE_PAPER_APP_SECRET: ${{ secrets.LONGBRIDGE_PAPER_APP_SECRET }}
          LONGBRIDGE_PAPER_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_PAPER_ACCESS_TOKEN }}
          LONGBRIDGE_DEFAULT_MODE: paper
          LONGBRIDGE_HTTP_URL: ${{ secrets.LONGBRIDGE_HTTP_URL }}
          LONGBRIDGE_REGION: ${{ secrets.LONGBRIDGE_REGION }}
          # Opt-in only; leave unset so CI never places orders.
          LONGBRIDGE_PAPER_ALLOW_ORDER: ${{ secrets.LONGBRIDGE_PAPER_ALLOW_ORDER }}
        run: pytest -q -m integration
